<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360"><title>Strzałki zmieniają pozycję: prawo x plus 10, lewo x minus 10, góra y plus 10, dół y minus 10.</title><rect x="0" y="0" width="1000" height="360" rx="15" fill="#eef7f5"/><rect x="345" y="35" width="280" height="78" rx="15" fill="#d8c9ff"/><text x="388" y="84" font-family="Arial,sans-serif" font-size="29" fill="#243d52">↑  y + 10</text><rect x="35" y="139" width="280" height="78" rx="15" fill="#c7ddff"/><text x="78" y="188" font-family="Arial,sans-serif" font-size="29" fill="#243d52">←  x − 10</text><rect x="655" y="139" width="280" height="78" rx="15" fill="#c7ddff"/><text x="698" y="188" font-family="Arial,sans-serif" font-size="29" fill="#243d52">→  x + 10</text><rect x="345" y="243" width="280" height="78" rx="15" fill="#d8c9ff"/><text x="388" y="292" font-family="Arial,sans-serif" font-size="29" fill="#243d52">↓  y − 10</text><text x="369" y="184" font-family="Arial,sans-serif" font-size="31" fill="#243d52">STERUJ!</text></svg>