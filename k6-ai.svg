<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330"><title>Poznaj możliwości AI i naucz się sprawdzać jej podpowiedzi.</title><rect x="0" y="0" width="1000" height="330" rx="12" fill="#eef7f3"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="25" fill="#244638">AI PODPOWIADA — TY SPRAWDZASZ</text><rect x="25" y="85" width="300" height="205" rx="12" fill="white"/><rect x="40" y="105" width="270" height="65" rx="12" fill="#ffe29a"/><text x="55" y="146" font-family="Arial,sans-serif" font-size="24" fill="#244638">Polecenie</text><text x="43" y="231" font-family="Arial,sans-serif" font-size="18" fill="#244638">Co chcę zrozumieć?</text><rect x="350" y="85" width="300" height="205" rx="12" fill="white"/><rect x="365" y="105" width="270" height="65" rx="12" fill="#d1e4ff"/><text x="380" y="146" font-family="Arial,sans-serif" font-size="24" fill="#244638">Odpowiedź</text><text x="368" y="231" font-family="Arial,sans-serif" font-size="18" fill="#244638">Może zawierać błędy</text><rect x="675" y="85" width="300" height="205" rx="12" fill="white"/><rect x="690" y="105" width="270" height="65" rx="12" fill="#dfd5ff"/><text x="705" y="146" font-family="Arial,sans-serif" font-size="24" fill="#244638">Weryfikacja</text><text x="693" y="231" font-family="Arial,sans-serif" font-size="18" fill="#244638">Sprawdzam w źródle</text></svg>