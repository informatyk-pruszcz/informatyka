<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330"><title>Zaprogramuj grę, w której strzałki prowadzą do skarbu.</title><rect x="0" y="0" width="1000" height="330" rx="12" fill="#eef7f3"/><text x="35" y="43" font-family="Arial,sans-serif" font-size="25" fill="#244638">RUCH → SPRAWDZENIE → EWENTUALNE COFNIĘCIE</text><rect x="40" y="80" width="410" height="210" rx="12" fill="white"/><rect x="360" y="90" width="35" height="190" rx="12" fill="#476a8e"/><circle cx="310" cy="185" r="23" fill="#f9c74f"/><text x="65" y="127" font-family="Arial,sans-serif" font-size="24" fill="#244638">Gracz → ściana</text><text x="495" y="115" font-family="Arial,sans-serif" font-size="24" fill="#244638">1. Zmień x o 3</text><text x="495" y="185" font-family="Arial,sans-serif" font-size="24" fill="#244638">2. Czy dotyka koloru ściany?</text><text x="495" y="255" font-family="Arial,sans-serif" font-size="24" fill="#244638">3. Jeśli tak: zmień x o -3</text></svg>