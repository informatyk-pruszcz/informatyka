<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330"><title>Zbuduj prosty budżet na fikcyjnych kwotach i sprawdź wynik.</title><rect x="0" y="0" width="1000" height="330" rx="12" fill="#eef7f3"/><text x="30" y="45" font-family="Arial,sans-serif" font-size="26" fill="#244638">FIKCYJNY BUDŻET: SPRAWDŹ FORMUŁY</text><rect x="35" y="75" width="420" height="62" rx="12" fill="white"/><text x="50" y="115" font-family="Arial,sans-serif" font-size="21" fill="#244638">Dostępne</text><text x="390" y="115" font-family="Arial,sans-serif" font-size="25" fill="#244638">50</text><rect x="35" y="150" width="420" height="62" rx="12" fill="white"/><text x="50" y="190" font-family="Arial,sans-serif" font-size="21" fill="#244638">Wydatki: 8 + 12 + 5</text><text x="390" y="190" font-family="Arial,sans-serif" font-size="25" fill="#244638">25</text><rect x="35" y="225" width="420" height="62" rx="12" fill="white"/><text x="50" y="265" font-family="Arial,sans-serif" font-size="21" fill="#244638">Zostaje: 50 − 25</text><text x="390" y="265" font-family="Arial,sans-serif" font-size="25" fill="#244638">25</text><text x="510" y="120" font-family="Arial,sans-serif" font-size="28" fill="#244638">B5: =SUMA(B2:B4)</text><text x="510" y="185" font-family="Arial,sans-serif" font-size="28" fill="#244638">B6: =B1-B5</text><text x="510" y="250" font-family="Arial,sans-serif" font-size="22" fill="#244638">Zmień kwotę → sprawdź wynik</text></svg>