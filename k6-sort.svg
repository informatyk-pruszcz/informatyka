<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330"><title>Uporządkuj wyniki, nie mieszając danych drużyn.</title><rect x="0" y="0" width="1000" height="330" rx="12" fill="#eef7f3"/><text x="30" y="45" font-family="Arial,sans-serif" font-size="25" fill="#244638">SORTUJ CAŁE WIERSZE — ZACHOWAJ PARY</text><rect x="45" y="70" width="380" height="48" rx="12" fill="#ffe29a"/><text x="65" y="103" font-family="Arial,sans-serif" font-size="23" fill="#244638">Wilki</text><text x="330" y="103" font-family="Arial,sans-serif" font-size="23" fill="#244638">99</text><rect x="45" y="127" width="380" height="48" rx="12" fill="white"/><text x="65" y="160" font-family="Arial,sans-serif" font-size="23" fill="#244638">Rysie</text><text x="330" y="160" font-family="Arial,sans-serif" font-size="23" fill="#244638">40</text><rect x="45" y="184" width="380" height="48" rx="12" fill="white"/><text x="65" y="217" font-family="Arial,sans-serif" font-size="23" fill="#244638">Lisy</text><text x="330" y="217" font-family="Arial,sans-serif" font-size="23" fill="#244638">15</text><rect x="45" y="241" width="380" height="48" rx="12" fill="white"/><text x="65" y="274" font-family="Arial,sans-serif" font-size="23" fill="#244638">Sowy</text><text x="330" y="274" font-family="Arial,sans-serif" font-size="23" fill="#244638">2</text><text x="500" y="133" font-family="Arial,sans-serif" font-size="25" fill="#244638">Malejąco: 99 → 40 → 15 → 2</text><text x="500" y="195" font-family="Arial,sans-serif" font-size="24" fill="#244638">Nazwa podróżuje z wynikiem.</text><text x="500" y="250" font-family="Arial,sans-serif" font-size="24" fill="#244638">Nie mieszaj danych drużyn!</text></svg>