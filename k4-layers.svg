<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300"><rect width="1000" height="300" rx="24" fill="#edf7f1"/><title>Osobne warstwy tła, krajobrazu i postaci składają się na jeden obraz</title><rect x="70" y="115" width="300" height="130" rx="14" fill="#b9dfe9" stroke="#476961" stroke-width="2"/><text x="95" y="233" font-family="Arial" font-size="25" fill="#205448">Tło</text><rect x="112" y="79" width="300" height="130" rx="14" fill="#8dcaa3" stroke="#476961" stroke-width="2"/><text x="137" y="197" font-family="Arial" font-size="25" fill="#205448">Krajobraz</text><rect x="154" y="43" width="300" height="130" rx="14" fill="#f7d56e" stroke="#476961" stroke-width="2"/><text x="179" y="161" font-family="Arial" font-size="25" fill="#205448">Postać</text><text x="520" y="110" font-family="Arial" font-size="31" fill="#205448" font-weight="bold">Osobne warstwy</text><text x="520" y="158" font-family="Arial" font-size="24" fill="#476961">Razem tworzą jeden obraz.</text><text x="520" y="205" font-family="Arial" font-size="22" fill="#476961">Sprawdzaj, na której rysujesz!</text></svg>