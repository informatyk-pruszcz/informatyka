name: Odbiór projektów XCF w GIMP
on:
  push:
    paths:
      - 'klasa7/pilot-warstwy/**'
      - 'tests/pilot-warstwy.scm'
      - '.github/workflows/gimp-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gimp:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Przygotuj GIMP 2.10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gimp xvfb xauth
      - name: Otwórz, przestaw warstwę, zapisz i sprawdź kopię
        run: |
          xvfb-run -a gimp -idf --batch-interpreter=plug-in-script-fu-eval -b '(load "tests/pilot-warstwy.scm")' -b '(gimp-quit 0)'
          test -f "$RUNNER_TEMP/gimp-pilot-ok"
