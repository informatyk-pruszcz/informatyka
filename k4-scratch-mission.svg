<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360"><title>Cztery etapy pracy nad grą: pomysł, bloczki, próba i poprawka.</title><rect x="0" y="0" width="1000" height="360" rx="15" fill="#eef7f5"/><rect x="25" y="65" width="225" height="215" rx="15" fill="white"/><rect x="43" y="84" width="189" height="57" rx="15" fill="#ffdc72"/><text x="55" y="122" font-family="Arial,sans-serif" font-size="20" fill="#243d52">1. POMYSŁ</text><text x="45" y="199" font-family="Arial,sans-serif" font-size="20" fill="#243d52">Co robi gracz?</text><rect x="270" y="65" width="225" height="215" rx="15" fill="white"/><rect x="288" y="84" width="189" height="57" rx="15" fill="#c7ddff"/><text x="300" y="122" font-family="Arial,sans-serif" font-size="20" fill="#243d52">2. BLOCZKI</text><text x="290" y="199" font-family="Arial,sans-serif" font-size="20" fill="#243d52">Układam skrypt.</text><rect x="515" y="65" width="225" height="215" rx="15" fill="white"/><rect x="533" y="84" width="189" height="57" rx="15" fill="#dfd1ff"/><text x="545" y="122" font-family="Arial,sans-serif" font-size="20" fill="#243d52">3. PRÓBA</text><text x="535" y="199" font-family="Arial,sans-serif" font-size="20" fill="#243d52">Czy to działa?</text><rect x="760" y="65" width="225" height="215" rx="15" fill="white"/><rect x="778" y="84" width="189" height="57" rx="15" fill="#bae5d2"/><text x="790" y="122" font-family="Arial,sans-serif" font-size="20" fill="#243d52">4. POPRAWKA</text><text x="780" y="199" font-family="Arial,sans-serif" font-size="20" fill="#243d52">Sprawdzam znów.</text><text x="250" y="325" font-family="Arial,sans-serif" font-size="23" fill="#243d52">Każdy dobry projekt rośnie małymi krokami.</text></svg>