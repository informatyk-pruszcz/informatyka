<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360"><title>Dwa duszki rozmawiają po kolei: pierwszy mówi przez 2 sekundy, drugi czeka 2 sekundy i odpowiada.</title><rect x="0" y="0" width="1000" height="360" rx="15" fill="#eef7f5"/><rect x="35" y="35" width="445" height="285" rx="15" fill="white"/><rect x="55" y="55" width="405" height="55" rx="15" fill="#ffdc72"/><text x="75" y="92" font-family="Arial,sans-serif" font-size="25" fill="#243d52">KOT</text><text x="60" y="155" font-family="Arial,sans-serif" font-size="22" fill="#243d52">Mówi przez 2 sekundy</text><rect x="55" y="180" width="405" height="85" rx="15" fill="#e8e0fc"/><text x="73" y="231" font-family="Arial,sans-serif" font-size="24" fill="#243d52">Cześć!</text><rect x="520" y="35" width="445" height="285" rx="15" fill="white"/><rect x="540" y="55" width="405" height="55" rx="15" fill="#c7ddff"/><text x="560" y="92" font-family="Arial,sans-serif" font-size="25" fill="#243d52">ROBOT</text><text x="545" y="155" font-family="Arial,sans-serif" font-size="22" fill="#243d52">Czeka 2 sekundy, potem mówi</text><rect x="540" y="180" width="405" height="85" rx="15" fill="#e8e0fc"/><text x="558" y="231" font-family="Arial,sans-serif" font-size="24" fill="#243d52">Witaj na mojej planecie!</text><text x="60" y="302" font-family="Arial,sans-serif" font-size="19" fill="#243d52">0–2 sekundy</text><text x="545" y="302" font-family="Arial,sans-serif" font-size="19" fill="#243d52">2–4 sekundy</text></svg>