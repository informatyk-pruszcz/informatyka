<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360"><title>Trzy połączone polecenia: start po kliknięciu flagi, ruch o 10 kroków i wypowiedź Cześć!</title><rect x="0" y="0" width="1000" height="360" rx="15" fill="#eef7f5"/><rect x="35" y="44" width="470" height="72" rx="15" fill="#ffdc72"/><text x="58" y="89" font-family="Arial,sans-serif" font-size="24" fill="#243d52">Kiedy kliknięto zieloną flagę</text><rect x="35" y="126" width="470" height="72" rx="15" fill="#c7ddff"/><text x="58" y="171" font-family="Arial,sans-serif" font-size="24" fill="#243d52">Przesuń o 10 kroków</text><rect x="35" y="208" width="470" height="72" rx="15" fill="#dfd1ff"/><text x="58" y="253" font-family="Arial,sans-serif" font-size="24" fill="#243d52">Powiedz Cześć! przez 2 sekundy</text><rect x="565" y="42" width="400" height="275" rx="15" fill="white"/><text x="590" y="83" font-family="Arial,sans-serif" font-size="23" fill="#243d52">TWÓJ PIERWSZY SKRYPT</text><circle cx="765" cy="190" r="57" fill="#ffd06d"/><path d="M715 160l4-55 42 31m20 0 36-31 0 55" fill="#ffd06d"/><circle cx="746" cy="180" r="6" fill="#243d52"/><circle cx="785" cy="180" r="6" fill="#243d52"/><path d="M748 211q17 16 34 0" fill="none" stroke="#243d52" stroke-width="4"/><text x="627" y="290" font-family="Arial,sans-serif" font-size="21" fill="#243d52">Połącz → uruchom → sprawdź</text></svg>