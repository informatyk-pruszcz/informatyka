<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330"><title>Odczytaj adres komórki i utwórz serię liczb.</title><rect x="0" y="0" width="1000" height="330" rx="12" fill="#eef7f3"/><text x="30" y="45" font-family="Arial,sans-serif" font-size="26" fill="#244638">ADRES KOMÓRKI = KOLUMNA + WIERSZ</text><text x="130" y="90" font-family="Arial,sans-serif" font-size="25" fill="#244638">A</text><text x="255" y="90" font-family="Arial,sans-serif" font-size="25" fill="#244638">B</text><text x="380" y="90" font-family="Arial,sans-serif" font-size="25" fill="#244638">C</text><text x="45" y="137" font-family="Arial,sans-serif" font-size="24" fill="#244638">1</text><rect x="90" y="105" width="115" height="50" rx="12" fill="white"/><text x="120" y="138" font-family="Arial,sans-serif" font-size="22" fill="#244638">A1</text><rect x="215" y="105" width="115" height="50" rx="12" fill="white"/><text x="245" y="138" font-family="Arial,sans-serif" font-size="22" fill="#244638">B1</text><rect x="340" y="105" width="115" height="50" rx="12" fill="white"/><text x="370" y="138" font-family="Arial,sans-serif" font-size="22" fill="#244638">C1</text><text x="45" y="197" font-family="Arial,sans-serif" font-size="24" fill="#244638">2</text><rect x="90" y="165" width="115" height="50" rx="12" fill="white"/><text x="120" y="198" font-family="Arial,sans-serif" font-size="22" fill="#244638">A2</text><rect x="215" y="165" width="115" height="50" rx="12" fill="#ffe29a"/><text x="245" y="198" font-family="Arial,sans-serif" font-size="22" fill="#244638">B2</text><rect x="340" y="165" width="115" height="50" rx="12" fill="white"/><text x="370" y="198" font-family="Arial,sans-serif" font-size="22" fill="#244638">C2</text><text x="45" y="257" font-family="Arial,sans-serif" font-size="24" fill="#244638">3</text><rect x="90" y="225" width="115" height="50" rx="12" fill="white"/><text x="120" y="258" font-family="Arial,sans-serif" font-size="22" fill="#244638">A3</text><rect x="215" y="225" width="115" height="50" rx="12" fill="white"/><text x="245" y="258" font-family="Arial,sans-serif" font-size="22" fill="#244638">B3</text><rect x="340" y="225" width="115" height="50" rx="12" fill="white"/><text x="370" y="258" font-family="Arial,sans-serif" font-size="22" fill="#244638">C3</text><text x="535" y="145" font-family="Arial,sans-serif" font-size="27" fill="#244638">B2: kolumna B, wiersz 2</text><text x="535" y="205" font-family="Arial,sans-serif" font-size="23" fill="#244638">Seria liczb: wpisz 1 i 2,</text><text x="535" y="245" font-family="Arial,sans-serif" font-size="23" fill="#244638">zaznacz obie i przeciągnij.</text></svg>