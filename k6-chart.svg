<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330"><title>Pokaż wyniki fikcyjnego głosowania na czytelnym wykresie.</title><rect x="0" y="0" width="1000" height="330" rx="12" fill="#eef7f3"/><text x="30" y="40" font-family="Arial,sans-serif" font-size="25" fill="#244638">GŁOSY NA DRUŻYNY — DANE FIKCYJNE</text><path d="M85 65v205h400" stroke="#527468" stroke-width="2" fill="none"/><text x="50" y="278" font-family="Arial,sans-serif" font-size="18" fill="#244638">0</text><text x="50" y="186" font-family="Arial,sans-serif" font-size="18" fill="#244638">4</text><text x="50" y="94" font-family="Arial,sans-serif" font-size="18" fill="#244638">8</text><rect x="120" y="86" width="70" height="184" fill="#4487bc"/><text x="145" y="76" font-family="Arial,sans-serif" font-size="20" fill="#244638">8</text><text x="120" y="305" font-family="Arial,sans-serif" font-size="20" fill="#244638">Lisy</text><rect x="240" y="155" width="70" height="115" fill="#9778be"/><text x="265" y="145" font-family="Arial,sans-serif" font-size="20" fill="#244638">5</text><text x="240" y="305" font-family="Arial,sans-serif" font-size="20" fill="#244638">Sowy</text><rect x="360" y="201" width="70" height="69" fill="#369a82"/><text x="385" y="191" font-family="Arial,sans-serif" font-size="20" fill="#244638">3</text><text x="360" y="305" font-family="Arial,sans-serif" font-size="20" fill="#244638">Wilki</text><text x="550" y="125" font-family="Arial,sans-serif" font-size="26" fill="#244638">8 + 5 + 3 = 16 głosów</text><text x="550" y="185" font-family="Arial,sans-serif" font-size="23" fill="#244638">Podpisy mówią, co widzimy.</text><text x="550" y="245" font-family="Arial,sans-serif" font-size="23" fill="#244638">Oś wartości zaczyna się od 0.</text></svg>